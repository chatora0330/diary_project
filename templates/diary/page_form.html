{% extends "base/diary_base.html" %}
{% block body %}

<div class="diary-form-card">
    <h2 class="diary-form-title">日記を書く</h2>

    <form method="POST" enctype="multipart/form-data" class="diary-form">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="button">保存</button>

            <a
                href="{% url 'diary:page_list' %}"
                class="button"
            >
                キャンセル
            </a>
        </div>
    </form>
</div>

{% endblock %}
